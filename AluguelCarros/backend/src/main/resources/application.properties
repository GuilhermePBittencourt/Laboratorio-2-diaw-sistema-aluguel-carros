spring.application.name=aluguel-carros
server.port=${PORT:8080}

# Banco de dados: Supabase (PostgreSQL). Os valores vêm de variáveis de ambiente (veja o README).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
# "update" cria o que faltar; para produção, rode database/schema.sql e use DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# JWT: o segredo NÃO tem valor padrão. Use pelo menos 32 caracteres.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# CORS: origens do front-end separadas por vírgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Dados iniciais (agentes de demonstração e alguns automóveis)
app.seed.enabled=${SEED_ENABLED:true}
app.seed.senha-agentes=${SEED_SENHA_AGENTES:}
